; ESP32 DevKit (ESP32-D0WD-V3, Xtensa LX6 @ 240 MHz). One firmware holds every algorithm; host/run_bench.py drives it over serial.
; PQClean sources are pulled in from the repo root by pqclean_sources.py, mbedtls and libsodium come with the Arduino-ESP32 framework.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 230400
board_build.partitions = huge_app.csv
board_build.f_flash = 80000000L
extra_scripts = pre:pqclean_sources.py
build_unflags = -Os
; The --wrap flags let src/memtrack.c count heap use (mbedtls mallocs a lot, PQClean only for the SHAKE/SHA-2 state).
; The map file is parsed by analysis/code_size.py to get flash use per algorithm.
build_flags =
    -O3 -fno-stack-protector -DCORE_DEBUG_LEVEL=0
    -I${PROJECT_DIR}/..
    -I${PROJECT_DIR}/../common
    -Wl,-Map=.pio/build/esp32dev/firmware.map
    -Wl,--wrap=malloc -Wl,--wrap=calloc -Wl,--wrap=realloc -Wl,--wrap=free
    -Wl,--wrap=heap_caps_malloc -Wl,--wrap=heap_caps_calloc -Wl,--wrap=heap_caps_realloc -Wl,--wrap=heap_caps_free
